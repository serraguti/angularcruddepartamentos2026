<div>
    <h2>Edit departamento</h2>
    @if (departamento){
        <form #editForm="ngForm">
            <label>Id: </label>
            <input type="number" #cajaid name="cajaid"
            class="form-control" value="{{departamento.numero}}"/><br/>
            <label>Nombre: </label>
            <input type="text" #cajanombre name="cajanombre"
            class="form-control" value="{{departamento.nombre}}"/><br/>
            <input type="text" #cajalocalidad name="cajalocalidad"
            class="form-control" value="{{departamento.localidad}}"/><br/>
            <button class="btn btn-warning" 
            (click)="updateDepartamento()">
                Update
            </button>
        </form>
    }
</div>
